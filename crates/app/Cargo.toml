[package]
name = "termden"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Workspaces and tiled terminals for coding agents (Claude Code, opencode, pi)"

[[bin]]
name = "termden"
path = "src/main.rs"

# The control CLI and MCP server; termden needs it on PATH for its agents.
[[bin]]
name = "termdenctl"
path = "src/bin/termdenctl/main.rs"

# `cargo binstall termden` downloads the release tarball instead of compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/termden-x86_64-linux.tar.gz"
pkg-fmt = "tgz"
bin-dir = "termden/{ bin }{ binary-ext }"

[dependencies]
termden-core.workspace = true
gpui.workspace = true
# gpui -> zed-async-tar -> xattr 0.2.3 references `libc::ENOATTR`, which libc
# stopped defining on Linux in 0.2.190. Keep libc pinned until xattr ships a
# fixed 0.2.x (or zed-async-tar moves to xattr 1.x).
libc = "=0.2.189"
alacritty_terminal = "0.26"
async-channel = "2"
serde_json = "1"
subsecond = { version = "0.7.10", optional = true }
dioxus-devtools = { version = "0.7.10", optional = true }

[build-dependencies]
# Only to check for system libraries up front (build.rs).
pkg-config = "0.3"

[features]
# Dev only: run under `dx serve --hotpatch` to patch code into the running app.
hotpatch = ["dep:subsecond", "dep:dioxus-devtools"]
