# Pushes to main: test + release build, which also fills the build cache.
# Tags like v0.2.0 (matching the workspace version) additionally publish a
# release; running apps offer it in their footer, `install.sh` fetches it.
# Tag runs may only restore caches saved on main, hence the main builds.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    # Oldest supported runner: the binary then runs on glibc >= 2.35.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }

      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          awk -v tag="$GITHUB_REF_NAME" '$0 ~ "^## " tag "( |$)" {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "CHANGELOG.md has no '## $GITHUB_REF_NAME' section"; exit 1; }

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev libfontconfig-dev libfreetype-dev \
            libxcb1-dev libx11-xcb-dev libzstd-dev libssl-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-release

      # Release-mode tests share compiled dependencies with the build below.
      - run: cargo test --release --workspace
      - run: cargo build --release -p termden

      - name: Package
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p dist/termden
          cp target/release/termden target/release/termdenctl dist/termden/
          cp assets/termden.desktop assets/termden.svg LICENSE dist/termden/
          tar -C dist -czf termden-x86_64-linux.tar.gz termden

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" termden-x86_64-linux.tar.gz --notes-file notes.md
